    {% extends 'base.html' %}

    {% block content %}
    <section class="content-section coming-soon-section">
        <div class="coming-soon-inner">
            <h1 class="coming-soon-title">{{ page_title }}</h1>
            <h2 class="coming-soon-subtitle">Coming Soon</h2>

            <div class="coming-soon-card">
                <p class="coming-soon-quote">
                    <i class="fa-solid fa-quote-left"></i>
                    {{ quote }}
                    <i class="fa-solid fa-quote-right"></i>
                </p>
            </div>

            <div class="coming-soon-cta">
                <a href="/" class="doodle-btn primary-btn"><i class="fa-solid fa-house"></i> Back to Home</a>
            </div>
        </div>
    </section>
    {% endblock %}
